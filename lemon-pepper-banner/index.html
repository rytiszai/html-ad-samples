<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chinook Seedery - Lemon Pepper 320x50</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 320px;
    height: 50px;
    overflow: hidden;
    background: #000;
  }
  .banner {
    position: relative;
    width: 320px;
    height: 50px;
  }
  .banner img {
    position: absolute;
    top: 0;
    left: 0;
    width: 320px;
    height: 50px;
    display: block;
  }
  .banner img.hidden {
    display: none;
  }
</style>
</head>
<body>
  <div class="banner">
    <img src="frame1.png" alt="Shop Bobby Witt Jr.'s Lemon Pepper Seeds">
    <img src="frame2.png" alt="Chinook Seedery Official Sunflower Seed of USA Baseball" class="hidden">
  </div>
  <script>
    var frames = document.querySelectorAll('.banner img');
    var current = 0;
    setInterval(function () {
      frames[current].classList.add('hidden');
      current = (current + 1) % frames.length;
      frames[current].classList.remove('hidden');
    }, 2000);
  </script>
</body>
</html>
